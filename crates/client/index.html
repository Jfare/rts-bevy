<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mini-RTS (Bevy 0.15 Wasm)</title>
    <link data-trunk rel="rust" data-bin="client" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0e11;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #d1d5db;
        }

        #bevy-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            width: 100% !important;
            height: 100% !important;
            display: block;
            outline: none;
        }

        #loading-overlay {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            z-index: 10;
            pointer-events: none;
            transition: opacity 0.4s ease-out;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(56, 189, 248, 0.2);
            border-top: 4px solid #38bdf8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .loading-text {
            font-size: 1.1rem;
            letter-spacing: 0.05em;
            color: #94a3b8;
            font-weight: 500;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Mobile Blocker */
        #mobile-blocker {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #070a0e;
            color: #f1f5f9;
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
            gap: 16px;
        }
        .mobile-blocker-card {
            max-width: 480px;
            background: #0f172a;
            border: 1px solid #f87171;
            border-radius: 12px;
            padding: 28px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
    </style>
</head>
<body>
    <div id="bevy-container">
        <div id="loading-overlay">
            <div class="spinner"></div>
            <div class="loading-text">Loading Mini-RTS (Bevy 0.15 Wasm)...</div>
        </div>
    </div>

    <div id="mobile-blocker">
        <div class="mobile-blocker-card">
            <div style="font-size: 2.5rem;">🖥️ 🚫 📱</div>
            <h2 style="color: #ffffff; font-size: 1.4rem;">Desktop Browser Required</h2>
            <p style="color: #94a3b8; font-size: 0.95rem; line-height: 1.5;">
                Mini-RTS is currently designed for desktop keyboard and mouse controls and is not supported on mobile devices.
            </p>
            <p style="color: #38bdf8; font-size: 0.85rem;">
                Please visit this URL on a desktop or laptop computer to play.
            </p>
        </div>
    </div>

    <script>
        // Prevent default right-click menu on window & canvas
        window.addEventListener('contextmenu', (e) => e.preventDefault());

        function isMobileDevice() {
            const userAgent = navigator.userAgent || navigator.vendor || window.opera || '';
            const mobileRegex = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Mobile|mobile|CriOS|FxiOS/i;
            if (mobileRegex.test(userAgent)) return true;
            if (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1) return true;
            if (navigator.userAgentData && navigator.userAgentData.mobile) return true;
            const isTouchOnly = window.matchMedia && window.matchMedia('(hover: none) and (pointer: coarse)').matches;
            const isSmallScreen = window.innerWidth <= 860 || window.innerHeight <= 550;
            return isTouchOnly && isSmallScreen;
        }

        if (isMobileDevice()) {
            const container = document.getElementById('bevy-container');
            if (container) container.remove();
            const blocker = document.getElementById('mobile-blocker');
            if (blocker) blocker.style.display = 'flex';
        } else {
            const observer = new MutationObserver(() => {
                const canvas = document.querySelector('canvas');
                if (canvas) {
                    canvas.tabIndex = 0;
                    canvas.focus();
                    canvas.addEventListener('contextmenu', (e) => e.preventDefault());
                    window.addEventListener('click', () => canvas.focus());

                    const overlay = document.getElementById('loading-overlay');
                    if (overlay) {
                        overlay.style.opacity = '0';
                        setTimeout(() => overlay.remove(), 400);
                    }
                    observer.disconnect();
                }
            });
            observer.observe(document.body, { childList: true, subtree: true });
        }
    </script>
</body>
</html>
