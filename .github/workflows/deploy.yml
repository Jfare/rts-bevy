name: Build, Test & Deploy to UpCloud VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: 🚀 Build, Test & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Linux dependencies for Bevy & Trunk
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev pkg-config
          # Fast install Trunk prebuilt binary
          wget -qO- https://github.com/trunk-rs/trunk/releases/download/v0.21.5/trunk-x86_64-unknown-linux-gnu.tar.gz | sudo tar -xzf- -C /usr/local/bin

      - name: Security & Dependency Verification
        run: |
          chmod +x ./scripts/security_audit.sh
          ./scripts/security_audit.sh

      - name: Run Workspace Tests
        run: cargo test --workspace

      - name: Build WebAssembly Client (Trunk)
        run: trunk build --release

      - name: Build Dedicated Server Binary
        run: cargo build --release --bin server

      - name: Package Lightweight Deployment Bundle
        run: |
          mkdir -p deploy/bin deploy/dist deploy/docker
          cp -r dist/* deploy/dist/
          cp target/release/server deploy/bin/server
          cp docker-compose.yml deploy/
          cp docker/Dockerfile.server deploy/docker/
          cp docker/Dockerfile.client deploy/docker/
          cp docker/Caddyfile deploy/docker/

      - name: Setup SSH Key & Known Hosts
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Ensure Remote Directory Exists & Clean Old Build Cache
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          ssh -o StrictHostKeyChecking=accept-new "$SSH_USER@$SSH_HOST" "bash -c '
            mkdir -p /opt/rts-bevy
            # Free up disk space from previous compilation attempts on VPS
            docker builder prune -af --filter until=1h || true
            docker system prune -f || true
          '"

      - name: Sync Lightweight Deployment to VPS
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          rsync -avz --delete ./deploy/ "$SSH_USER@$SSH_HOST:/opt/rts-bevy/"

      - name: Launch Docker Containers on VPS
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          ssh "$SSH_USER@$SSH_HOST" "bash -c '
            set -euo pipefail
            cd /opt/rts-bevy
            echo \"Building lightweight containers from pre-built artifacts...\"
            docker compose build
            docker compose up -d --remove-orphans
          '"

      - name: Verify Live Telemetry & Health
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          ssh "$SSH_USER@$SSH_HOST" "bash -c '
            echo \"Checking container status...\"
            docker compose ps
            echo \"Checking local health endpoint...\"
            for i in {1..10}; do
              if curl -s --fail http://127.0.0.1:8080/health; then
                echo \"\"
                echo \"✅ Health check passed!\"
                break
              fi
              echo \"Waiting for game server to spin up... (\$i/10)\"
              sleep 2
            done
            echo \"Live match stats:\"
            curl -s http://127.0.0.1:8080/api/stats || true
            echo \"\"
          '"
