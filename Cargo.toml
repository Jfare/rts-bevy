[workspace]
resolver = "2"
members = [
    "crates/shared",
    "crates/client",
    "crates/server",
    "crates/bot_ai",
]

[workspace.dependencies]
bevy = { version = "0.15", default-features = false }
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
glam = "0.29"

# Enable a small amount of optimization in debug mode to keep frame rates playable
[profile.dev]
opt-level = 1

# Optimize all dependencies in dev mode for faster runtime
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
