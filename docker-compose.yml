services:
  # Dedicated Headless Bevy 0.15 RTS Server
  game-server:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    container_name: rts-bevy-server
    restart: unless-stopped
    ports:
      # Bound strictly to localhost so Docker never exposes it to the public internet
      - "127.0.0.1:8080:8080"
    environment:
      - PORT=8080
      - RUST_LOG=info
    networks:
      - rts-net

  # Web Client Static Host, Caddy HTTPS & Reverse Proxy
  web-client:
    build:
      context: .
      dockerfile: docker/Dockerfile.client
    container_name: rts-bevy-web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - RTS_DOMAIN=${RTS_DOMAIN:-rts.farell.ax}
    depends_on:
      - game-server
    networks:
      - rts-net

networks:
  rts-net:
    driver: bridge

